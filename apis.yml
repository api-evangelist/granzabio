name: Granza Bio
description: >-
  Granza Bio is an early-stage biotechnology company reprogramming immunity for
  target-specific medicines. Founded in 2024 by Dr. Ashwin Nandakumar, Dr. Ashwin
  Jainarayanan, and Prof. Michael Dustin, the company builds on the discovery of
  "attack particles" — killing entities released by cytotoxic immune cells,
  characterized in Prof. Dustin's laboratory at the University of Oxford. Granza
  Bio is developing an engineered delivery-shell platform that directs therapeutic
  cargo to specific tissues, with the goal of advancing treatments for cancers,
  autoimmune disorders, and infections. The company raised $7.14M in seed funding
  co-led by Refactor Capital and Felicis, with participation from Pioneer Fund and
  Y Combinator. It is a research-stage life-sciences company and does not currently
  publish a public developer API, SDK, or developer portal; this profile is
  maintained in the API Evangelist network as a company record.
